name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - front
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 레포 루트에서 pull: .vercel/project.json 과 .vercel/.env.production.local 이 루트에 생성됨
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: |
          if [ -f ../.vercel/.env.production.local ]; then
            set -a && source ../.vercel/.env.production.local && set +a
          fi
          pnpm run build

      # .vercel/output 을 레포 루트에 생성: deploy --prebuilt 는 CWD 기준으로 output 을 찾음
      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r frontend/dist/. .vercel/output/static/
          printf '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/((?!api/).*)", "dest":"/index.html"}]}\n' \
            > .vercel/output/config.json

      # 레포 루트에서 deploy: rootDirectory=frontend 경로 중복 문제 해소
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
